services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  api:
    build: ./malha
    ports:
      - "8000:8000"
    environment:
      # Compose local de estudo: perfil local (demo e seed). Numa instalação exposta use
      # MIND_PROFILE=remote e MIND_ADMIN_TOKEN (segredo próprio), e emita tokens por espaço.
      MIND_PROFILE: ${MIND_PROFILE:-local}
      MIND_ADMIN_TOKEN: ${MIND_ADMIN_TOKEN:-}
      MIND_SHARED_DB: /data/mesh.sqlite
      MIND_COMPOSER_URL: http://ollama:11434
      MIND_COMPOSER_MODEL: llama3.2:3b
      MIND_COMPOSER_TIMEOUT_SECONDS: "120"
      MIND_EMBEDDING_BACKEND: sentence
      MIND_EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - mind-data:/data
    depends_on:
      - ollama

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_MIND_TOKEN: mind-demo-atlas-norte
    depends_on:
      - api

volumes:
  mind-data:
  ollama-data:
