[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-shared"
version = "0.1.0"
description = "Malha cognitiva compartilhada: índice híbrido, grafo e evidências com proveniência."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.1.0",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
embeddings = ["sentence-transformers>=3.0.0"]

[project.scripts]
mind-shared = "mind_shared.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mind_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
