name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  malha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies from hashed locks (wheels only)
        run: |
          python -m pip install --only-binary :all: --require-hashes -r malha/requirements.lock
          python -m pip install --only-binary :all: --require-hashes -r malha/requirements-dev.lock
      - name: Tests (API, retrieval, access control, retention, backup, concurrency)
        working-directory: malha
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:warnings --junitxml=pytest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest.xml").getroot()
          suites = root.findall("testsuite") or [root]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} failures+errors={bad}")
          raise SystemExit(0 if tests > 0 and bad == 0 else 1)
          PY
      - name: Offline evaluation on the demo corpus (extractive composer, hashing embeddings)
        working-directory: malha
        env:
          MIND_SHARED_DB: ${{ runner.temp }}/mesh.sqlite
          PYTHONPATH: .
        run: |
          python -m mind_shared.cli seed
          python -m mind_shared.cli eval

  wallet-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the wallet package the atlas imports (file:.. dependency)
        run: |
          npm ci --ignore-scripts
          npm run build
      - working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (same Dockerfile as Compose)
        run: docker build -t mind-shared-api:ci malha
      - name: Scan the final image (HIGH/CRITICAL block)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-version-check mind-shared-api:ci
      - name: Remote profile refuses to start without an admin token
        run: |
          set +e
          docker run --rm -e MIND_PROFILE=remote mind-shared-api:ci python -c "from mind_shared.api.app import create_app; create_app()"
          test $? -ne 0

  web-image:
    # O atlas é entregue pelo Compose com `web/Dockerfile` e contexto na raiz (dependência
    # `file:..` compilada na imagem). Este job constrói exatamente essa imagem a partir de um
    # checkout limpo e prova que o servidor resolve os módulos que importam o pacote compartilhado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the atlas image (same Dockerfile and context as Compose)
        run: docker build -t mind-shared-web:ci -f web/Dockerfile .
      - name: Smoke — the dev server resolves the shared package imports
        run: |
          docker run -d --name atlas -p 127.0.0.1:5173:5173 -e VITE_API_URL=http://127.0.0.1:8000 mind-shared-web:ci
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "o servidor do atlas não respondeu em 120 s" >&2
            docker logs atlas 2>&1 | tail -60
            exit 1
          fi
          curl -fsS http://127.0.0.1:5173/ | grep -q "Mind Shared"
          curl -fsS http://127.0.0.1:5173/src/api.ts | grep -q "fetchGraph"
          curl -fsS http://127.0.0.1:5173/src/types.ts >/dev/null
          # O Vite reescreve a importação do pacote compartilhado para o caminho resolvido (/@fs/... ou /node_modules/...).
          curl -fsS "http://127.0.0.1:5173/src/api.ts" | grep -Eq 'from "/(@fs|node_modules)/[^"]*archive/client\.js"'
          curl -fsS "http://127.0.0.1:5173/src/types.ts" | grep -Eq 'from "/(@fs|node_modules)/[^"]*archive/types\.js"'
          docker logs atlas 2>&1 | tail -40
          if docker logs atlas 2>&1 | grep -iE "could not be resolved|Pre-transform error"; then
            echo "o servidor do atlas registrou módulo não resolvido" >&2
            exit 1
          fi
          docker rm -f atlas
